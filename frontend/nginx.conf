server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html has no content hash and referenced JS/CSS bundle filenames change on every
    # deploy (Vite content-hashes them) — without this, a browser or an installed TWA resuming
    # from Android's recent-apps cache can keep serving an old index.html that still points at a
    # deploy from several fixes ago, showing bugs that were already fixed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # Default 1M is too small for an uploaded invoice/quotation PDF (POST /api/shared-documents) —
        # these are html2canvas screenshots embedded as PNG, not vector text, so even one page can
        # run several MB; matches the backend's own 25MB multer limit with a little headroom.
        client_max_body_size 30M;
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.apk$ {
        default_type application/vnd.android.package-archive;
    }
}
